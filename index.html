<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lichforge</title>
  <meta property="og:title" content="Lichforge" />
  <meta property="og:image" content="https://lichforge.studio/assets/lichforge-og.png" />
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="backdrop"></div>
  <div class="mist"></div>
  <div class="mist mist--two"></div>
  <canvas id="atmosphere" aria-hidden="true"></canvas>

  <main>
    <img
      src="assets/lichforge-logo.png"
      alt="Lichforge"
      class="logo"
    />

    <a
      href="https://discord.gg/MRqhZrdRw6"
      target="_blank"
      rel="noopener noreferrer"
      class="discord-btn"
      aria-label="Join our Discord server"
    >
      <!-- Beveled dark-steel fantasy plaque with pointed finials -->
      <svg class="btn-frame" viewBox="0 0 360 88" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
        <defs>
          <linearGradient id="plaqueFill" x1="180" y1="6" x2="180" y2="82" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#193440" />
            <stop offset="48%" stop-color="#0b1820" />
            <stop offset="100%" stop-color="#122933" />
          </linearGradient>
          <linearGradient id="steelRim" x1="0" y1="0" x2="360" y2="88" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#8ec5ce" />
            <stop offset="25%" stop-color="#3c626b" />
            <stop offset="50%" stop-color="#a2e8f0" />
            <stop offset="75%" stop-color="#355861" />
            <stop offset="100%" stop-color="#7eb8c2" />
          </linearGradient>
        </defs>
        <!-- Outer notched plaque -->
        <path
          d="M28 6 H332 L341 20 L356 44 L341 68 L332 82 H28 L19 68 L4 44 L19 20 Z"
          fill="url(#plaqueFill)"
          stroke="url(#steelRim)"
          stroke-width="3"
          stroke-linejoin="miter"
        />
        <!-- Inner cyan hairline trim -->
        <path
          d="M33 13 H327 L334 24 L346 44 L334 64 L327 75 H33 L26 64 L14 44 L26 24 Z"
          stroke="#4dd0e1"
          stroke-opacity="0.45"
          stroke-width="1.2"
        />
        <!-- Left & right cyan diamond finials -->
        <polygon points="18,44 24,38 30,44 24,50" fill="#5eead4" stroke="#cffafe" stroke-width="1" />
        <polygon points="330,44 336,38 342,44 336,50" fill="#5eead4" stroke="#cffafe" stroke-width="1" />
      </svg>

      <span class="btn-content">
        <svg class="clyde-icon" viewBox="0 0 127.14 96.36" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"/>
        </svg>
        <span class="btn-labels">
          <span class="btn-kicker">JOIN OUR</span>
          <span class="btn-title">DISCORD</span>
        </span>
      </span>
    </a>
  </main>

  <script src="particles.js" defer></script>
</body>
</html>
